 {% load static %} 
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <title>
        {% block title%}
        Tweet App
         {% endblock %}        
    </title>
</head>
<body class="bg-dark ">

    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Tweet</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">login</a>
        </li>
        {% comment %} <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>  {% endcomment %}
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true" href="">Loggedout</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
    <div class="container mt-5">
        {% block content %}

        {% endblock %}
    </div>

 <div class="container my-5">

<!-- Remove the container if you want to extend the Footer to full width. -->
<div class="container my-5 p-0">

  <footer class="bg-light text-center text-white">
  <!-- Grid container -->
  <div class="container p-4 pb-0">
    <!-- Section: Social media -->
   <!-- Social Media Icons -->
<div class="d-flex justify-content-center align-items-center gap-3 mt-3">

    <!-- WhatsApp -->
    <a 
        class="btn btn-success rounded-circle d-flex align-items-center justify-content-center"
        href="#"
        role="button"
        style="width:45px; height:45px;"
    >
        <i class="bi bi-whatsapp text-white"></i>
    </a>

    <!-- Instagram -->
    <a 
        href="#"
        class="btn btn-light rounded-circle d-flex align-items-center justify-content-center border"
        style="width:45px; height:45px;"
    >
        <i class="bi bi-instagram text-danger"></i>
    </a>

    <!-- LinkedIn -->
    <a 
        href="#"
        class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
        style="width:45px; height:45px;"
    >
        <i class="bi bi-linkedin text-white"></i>
    </a>
    <!-- GitHub -->
    <a 
        href="#"
        class="btn btn-dark rounded-circle d-flex align-items-center justify-content-center"
        style="width:45px; height:45px;"
    >
        <i class="bi bi-github text-white"></i>
    </a>

</div>

  </div>
  <!-- Grid container -->

  <!-- Copyright -->
  <div class="text-center p-3 m-2 " style="background-color: rgba(15, 12, 12, 0.91);">
    © 2020 Copyright:
    <a class="text-white" href="https://mdbootstrap.com/">TweetApp</a>
  </div>
  <!-- Copyright -->
</footer>
  
</div>
<!-- End of .container -->
    
    
</body>
</html>
